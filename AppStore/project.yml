# XcodeGen spec for the Mac App Store edition of MacMonitor.
# Generate the project with:  cd AppStore && xcodegen generate
# The App Store edition is compiled with -D APPSTORE, which removes the SSH remote-server
# feature entirely (App Sandbox does not allow launching /usr/bin/ssh).
name: MacMonitorAppStore
options:
  bundleIdPrefix: com.tweetso
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: NWPTRYJ9FL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  MacMonitor:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/MacMonitor
        includes:
          - "*.swift"
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MacMonitor
        PRODUCT_BUNDLE_IDENTIFIER: com.tweetso.macmonitor
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MacMonitor.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG APPSTORE"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"
schemes:
  MacMonitor:
    build:
      targets:
        MacMonitor: all
    run:
      config: Debug
    archive:
      config: Release
